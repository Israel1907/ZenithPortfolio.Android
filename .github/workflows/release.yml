# Release workflow for ZenithPortfolio-Android
# Builds an unsigned release APK on every push to main.

name: Release

on:
  push:
    branches:
      - main

jobs:
  release-build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── JDK ───────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── Gradle cache ──────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── Release build (unsigned) ──────────────────────────────
      # TODO: To sign the release APK, add the following repository secrets:
      #   - KEYSTORE_BASE64      : base64-encoded .jks keystore file
      #   - KEYSTORE_PASSWORD    : keystore password
      #   - KEY_ALIAS            : signing key alias
      #   - KEY_PASSWORD         : signing key password
      #
      # Then decode the keystore and configure signingConfigs in build.gradle.kts:
      #
      #   - name: Decode keystore
      #     run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
      #
      #   android {
      #       signingConfigs {
      #           create("release") {
      #               storeFile = file("release.jks")
      #               storePassword = System.getenv("KEYSTORE_PASSWORD")
      #               keyAlias = System.getenv("KEY_ALIAS")
      #               keyPassword = System.getenv("KEY_PASSWORD")
      #           }
      #       }
      #       buildTypes {
      #           release { signingConfig = signingConfigs.getByName("release") }
      #       }
      #   }
      - name: Assemble release APK (unsigned)
        run: ./gradlew :app:assembleRelease --no-daemon

      # ── Upload release APK ────────────────────────────────────
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
